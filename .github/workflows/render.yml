name: Render Video

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Remotion
        run: npx @puppeteer/browsers install chrome@stable

      - name: Render video
        run: npx remotion render src/index.ts AugmentedCFO out/video.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: augmented-cfo-video
          path: out/video.mp4
          retention-days: 14
